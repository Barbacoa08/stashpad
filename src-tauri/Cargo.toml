[package]
name = "stashpad-alpha-kit"
version = "0.1.0"
edition = "2021"
[lib]
name = "stashpad_alpha_kit"
crate-type = ["staticlib", "cdylib", "rlib"]
[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }
[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
tauri-plugin-opener = "=2.7.3"
tauri-plugin-clipboard-manager = "=2.5.0"
rusqlite = { version = "=0.41.1", features = ["bundled"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.29.2", features = ["v4", "serde"] }
[dev-dependencies]
tempfile = "=3.27.0"
[profile.dev]
debug = 0
[profile.test]
debug = 0
